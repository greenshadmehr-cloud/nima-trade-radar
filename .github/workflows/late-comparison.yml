name: NIMA Radar Late Signal Comparison

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'MEXC USDT perpetual symbol (example: BTC_USDT)'
        required: true
        default: 'BTC_USDT'
        type: string
      days:
        description: 'Historical test window (5 to 90 days)'
        required: true
        default: '14'
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run late-signal comparison
        run: python radar_v2.py --late-comparison "${{ inputs.symbol }}" --days "${{ inputs.days }}"
