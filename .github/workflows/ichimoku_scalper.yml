
name: NIMA ICHIMOKU SCALPER V3

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run backtest
        run: python nima_ichimoku_scalper_v4.py --symbol BTC_USDT --days 90

      - name: Upload trade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIMA-BTC-Trade-Report
          path: trades_BTC_USDT_30d.csv
          if-no-files-found: warn
          retention-days: 7
